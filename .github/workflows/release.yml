name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: rust
        run: cargo build --release --locked
      - name: Rename
        run: Copy-Item rust/target/release/sit_reminder.exe SitReminder.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SitReminder
          path: SitReminder.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: SitReminder.exe
